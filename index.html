<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex TradingView Style Backtest</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #131722; color: #d1d4dc; margin: 0; padding: 20px; }
        h2 { color: #26a69a; margin-top: 0; }
        .container { display: flex; gap: 20px; }
        #chart-container { flex: 3; height: 600px; background: #1e222d; border-radius: 8px; padding: 10px; position: relative; }
        .control-panel { flex: 1; background: #1e222d; border-radius: 8px; padding: 20px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-buy { background-color: #26a69a; color: white; }
        .btn-sell { background-color: #ef5350; color: white; }
        .btn-next { background-color: #2962ff; color: white; }
        .stats { margin-top: 20px; font-size: 15px; line-height: 1.6; }
    </style>
</head>
<body>

    <h2>📈 Forex TradingView Style Backtest & Replay</h2>
    <div class="container">
        <div id="chart-container"></div>
        <div class="control-panel">
            <h3>🕹️ ควบคุมการซ้อมเทรด</h3>
            <p>เงินทุนพอร์ต: <span id="balance" style="color: #26a69a; font-weight: bold;">\$10,000.00</span></p>
            <p>สถานะปัจจุบัน: <span id="position-status" style="color: #ffa726;">Flat (ไม่มีออร์เดอร์)</span></p>
            
            <button class="btn btn-next" onclick="nextBar()">▶️ ไปแท่งถัดไป (+1 Bar)</button>
            <hr style="border-color: #2a2e39;">
            <button class="btn btn-buy" onclick="openTrade('BUY')">🟢 BUY (Long)</button>
            <button class="btn btn-sell" onclick="openTrade('SELL')">🔴 SELL (Short)</button>
            <button class="btn" style="background-color: #787b86; color: white;" onclick="closeTrade()">❌ ปิดออร์เดอร์</button>

            <div class="stats">
                <h4>📊 สถิติการเทรด</h4>
                <p>ราคาเข้าล่าสุด: <span id="entry-price">-</span></p>
                <p>กำไร/ขาดทุนรวม: <span id="total-profit">\$0.00</span></p>
                <p id="progress-info" style="color: #787b86; margin-top: 15px;"></p>
            </div>
        </div>
    </div>

    <script>
        // ตรวจสอบการโหลดไลบรารี
        if (typeof LightweightCharts === 'undefined') {
            alert('กำลังโหลดไลบรารีกราฟ กรุณารอสักครู่แล้วรีเฟรชหน้าเว็บอีกครั้ง');
        }

        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: 580,
            layout: { background: { color: '#1e222d' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            timeScale: { timeVisible: true, secondsVisible: false },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });

        // ข้อมูลราคาย้อนหลังจำลองสำหรับฝึกซ้อม
        const fullData = [
            { time: '2026-01-01', open: 1.0850, high: 1.0900, low: 1.0820, close: 1.0880 },
            { time: '2026-01-02', open: 1.0880, high: 1.0920, low: 1.0860, close: 1.0910 },
            { time: '2026-01-03', open: 1.0910, high: 1.0950, low: 1.0890, close: 1.0930 },
            { time: '2026-01-04', open: 1.0930, high: 1.0940, low: 1.0870, close: 1.0890 },
            { time: '2026-01-05', open: 1.0890, high: 1.0960, low: 1.0880, close: 1.0950 },
            { time: '2026-01-06', open: 1.0950, high: 1.0980, low: 1.0920, close: 1.0940 },
            { time: '2026-01-07', open: 1.0940, high: 1.0990, low: 1.0930, close: 1.0980 },
            { time: '2026-01-08', open: 1.0980, high: 1.1020, low: 1.0950, close: 1.1010 },
            { time: '2026-01-09', open: 1.1010, high: 1.1030, low: 1.0970, close: 1.0980 },
            { time: '2026-01-10', open: 1.0980, high: 1.1050, low: 1.0960, close: 1.1040 },
            { time: '2026-01-11', open: 1.1040, high: 1.1080, low: 1.1000, close: 1.1020 },
            { time: '2026-01-12', open: 1.1020, high: 1.1060, low: 1.0990, close: 1.1050 }
        ];

        let visibleCount = 5; 
        let balance = 10000.0;
        let position = null;
        let entryPrice = 0;

        function updateChart() {
            const currentSlice = fullData.slice(0, visibleCount);
            candlestickSeries.setData(currentSlice);
            document.getElementById('progress-info').innerText = `แท่งเทียนที่: ${visibleCount} / ${fullData.length}`;
        }

        updateChart();

        function nextBar() {
            if (visibleCount < fullData.length) {
                visibleCount++;
                updateChart();
            } else {
                alert("สิ้นสุดข้อมูลกราฟย้อนหลังแล้ว");
            }
        }

        function openTrade(type) {
            if (position !== null) {
                alert("คุณมีออร์เดอร์ที่เปิดอยู่แล้ว กรุณาปิดออร์เดอร์ก่อน");
                return;
            }
            position = type;
            entryPrice = fullData[visibleCount - 1].close;
            document.getElementById('position-status').innerText = `เปิด ${type}`;
            document.getElementById('position-status').style.color = type === 'BUY' ? '#26a69a' : '#ef5350';
            document.getElementById('entry-price').innerText = entryPrice;
        }

        function closeTrade() {
            if (position === null) {
                alert("ยังไม่มีออร์เดอร์ที่เปิดอยู่");
                return;
            }
            const currentPrice = fullData[visibleCount - 1].close;
            let profit = position === 'BUY' ? (currentPrice - entryPrice) * 10000 : (entryPrice - currentPrice) * 10000;
            
            balance += profit;
            document.getElementById('balance').innerText = `$${balance.toFixed(2)}`;
            document.getElementById('total-profit').innerText = `$${profit.toFixed(2)}`;
            document.getElementById('total-profit').style.color = profit >= 0 ? '#26a69a' : '#ef5350';
            
            position = null;
            document.getElementById('position-status').innerText = 'Flat (ไม่มีออร์เดอร์)';
            document.getElementById('position-status').style.color = '#ffa726';
        }
    </script>
</body>
</html>
